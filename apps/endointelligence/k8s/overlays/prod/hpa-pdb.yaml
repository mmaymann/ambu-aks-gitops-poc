apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: endointelligence
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: endointelligence
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: endointelligence
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: endointelligence
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
