apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xendointelligences.product.ambu.com
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  group: product.ambu.com
  names:
    kind: XEndoIntelligence
    plural: xendointelligences
  claimNames:
    kind: EndoIntelligence
    plural: endointelligences
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - parameters
              properties:
                parameters:
                  type: object
                  required:
                    - location
                    - resourceGroupName
                    - environment
                    - identityName
                  properties:
                    location:
                      type: string
                      default: northeurope
                    resourceGroupName:
                      type: string
                    environment:
                      type: string
                      enum: [dev, prod]
                    identityName:
                      type: string
                    aksOidcIssuer:
                      type: string
                      description: AKS OIDC issuer URL used for federated credentials.
                    serviceAccountNamespace:
                      type: string
                    serviceAccountName:
                      type: string
                      default: endointelligence
            status:
              type: object
              properties:
                identityClientId:
                  type: string
                identityPrincipalId:
                  type: string
